[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fair-signal"
version = "0.1.0"
description = "Single-intersection traffic signal control with efficiency and waiting fairness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "highsun" }]
dependencies = [
    "torch>=2.7,<3",
    "stable-baselines3>=2.7,<3",
    "sumo-rl>=1.4.5,<2",
    "gymnasium>=1.0,<1.3",
    "traci==1.28.0",
    "sumolib==1.28.0",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "PyYAML>=6,<7",
    "tensorboard>=2.18,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
fair-signal = "fair_signal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fair_signal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest -m 'not integration'"
markers = ["integration: requires a local SUMO process and TraCI socket"]
